name: DNS deep audit

on:
  push:
    paths:
      - ".github/workflows/dns-deep-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils iputils-ping curl

      - name: Run audit
        shell: bash
        run: |
          set +e
          OUT=dns-audit-result.txt
          : > "$OUT"
          {
            echo "=== timestamp ==="
            date -u
            echo

            echo "=== system resolvers ==="
            cat /etc/resolv.conf
            echo

            echo "=== parent zone dpdns.org public view ==="
            dig dpdns.org A +noall +answer +comments
            dig dpdns.org AAAA +noall +answer +comments
            dig dpdns.org NS +noall +answer +comments
            echo

            echo "=== DigitalPlat NS A/AAAA ==="
            for ns in ns1.digitalplat.org ns2.digitalplat.org ns3.digitalplat.org ns4.digitalplat.org; do
              echo "--- $ns ---"
              dig "$ns" A +short
              dig "$ns" AAAA +short
            done
            echo

            echo "=== child delegation from each DigitalPlat authoritative NS ==="
            for pair in               "ns1.digitalplat.org 23.238.4.245"               "ns2.digitalplat.org 104.168.62.90"               "ns3.digitalplat.org 45.77.69.29"               "ns4.digitalplat.org 192.3.249.191"; do
              set -- $pair
              ns=$1
              ip=$2
              echo "--- $ns ($ip) UDP NS ---"
              dig @"$ip" loprax.dpdns.org NS +norecurse +time=3 +tries=1 +noall +answer +authority +comments
              echo "--- $ns ($ip) TCP NS ---"
              dig +tcp @"$ip" loprax.dpdns.org NS +norecurse +time=3 +tries=1 +noall +answer +authority +comments
            done
            echo

            echo "=== repeated authoritative UDP reliability test (10 each) ==="
            for pair in               "ns1 23.238.4.245"               "ns2 104.168.62.90"               "ns3 45.77.69.29"               "ns4 192.3.249.191"; do
              set -- $pair
              label=$1
              ip=$2
              ok=0
              fail=0
              echo "--- $label $ip ---"
              for i in $(seq 1 10); do
                if dig @"$ip" loprax.dpdns.org NS +norecurse +time=2 +tries=1 +short >/tmp/digout 2>/tmp/digerr; then
                  if grep -Eq 'lovisa\.ns\.cloudflare\.com|rodrigo\.ns\.cloudflare\.com' /tmp/digout; then
                    ok=$((ok+1))
                  else
                    fail=$((fail+1))
                    echo "try $i unexpected: $(tr '\n' ' ' </tmp/digout)"
                  fi
                else
                  fail=$((fail+1))
                  echo "try $i failed: $(tr '\n' ' ' </tmp/digerr)"
                fi
              done
              echo "summary ok=$ok fail=$fail"
            done
            echo

            echo "=== Cloudflare authoritative answers ==="
            for ns in lovisa.ns.cloudflare.com rodrigo.ns.cloudflare.com; do
              echo "--- $ns A ---"
              dig @"$ns" loprax.dpdns.org A +norecurse +time=3 +tries=1 +noall +answer +comments
              echo "--- $ns AAAA ---"
              dig @"$ns" loprax.dpdns.org AAAA +norecurse +time=3 +tries=1 +noall +answer +comments
              echo "--- $ns SOA ---"
              dig @"$ns" loprax.dpdns.org SOA +norecurse +time=3 +tries=1 +noall +answer +comments
            done
            echo

            echo "=== recursive resolvers ==="
            for r in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222 223.5.5.5 119.29.29.29; do
              echo "--- resolver $r A ---"
              dig @"$r" loprax.dpdns.org A +time=3 +tries=1 +noall +answer +comments
              echo "--- resolver $r NS ---"
              dig @"$r" loprax.dpdns.org NS +time=3 +tries=1 +noall +answer +comments
            done
            echo

            echo "=== trace ==="
            dig +trace loprax.dpdns.org A
            echo

            echo "=== HTTPS normal ==="
            curl -I -L --max-time 20 -sS -D - https://loprax.dpdns.org/ -o /dev/null
            echo

            echo "=== HTTPS forced IP 104.21.40.53 ==="
            curl -I --max-time 20 -sS --resolve loprax.dpdns.org:443:104.21.40.53 -D - https://loprax.dpdns.org/ -o /dev/null
            echo

            echo "=== HTTPS forced IP 172.67.176.118 ==="
            curl -I --max-time 20 -sS --resolve loprax.dpdns.org:443:172.67.176.118 -D - https://loprax.dpdns.org/ -o /dev/null
          } >> "$OUT" 2>&1

      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dns-audit-result.txt
          git commit -m "chore: record DNS deep audit result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
