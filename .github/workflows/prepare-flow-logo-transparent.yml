name: Prepare transparent Flow logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-flow-logo-transparent.yml"
      - "scripts/remove-flow-logo-bg.py"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Remove black background without redesigning the logo
        run: python scripts/remove-flow-logo-bg.py

      - name: Commit transparent PNG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/flow/flow-logo.png
          if git diff --cached --quiet; then
            echo "Transparent logo is already up to date."
            exit 0
          fi
          git commit -m "Generate transparent Flow logo asset"
          git push
