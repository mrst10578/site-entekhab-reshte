name: Iran DNS audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/iran-dns-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query Iranian resolvers
        shell: bash
        run: |
          set +e
          for item in             "Shecan-1 178.22.122.100"             "Shecan-2 185.51.200.2"             "Electro-1 78.157.42.100"             "Electro-2 78.157.42.101"             "Begzar-1 185.55.225.25"             "Begzar-2 185.55.226.26"             "Shatel-1 85.15.1.14"             "Shatel-2 85.15.1.15"             "Nobar-1 78.110.120.220"             "Nobar-2 78.110.120.200"
          do
            name="${item%% *}"
            ip="${item##* }"
            echo "===== $name $ip ====="
            echo "-- A --"
            dig +time=3 +tries=1 @"$ip" A loprax.dpdns.org +noall +answer +authority +comments
            echo "-- NS --"
            dig +time=3 +tries=1 @"$ip" NS loprax.dpdns.org +noall +answer +authority +comments
            echo
          done
