name: DNSSEC audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dnssec-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit DNSSEC chain
        shell: bash
        run: |
          set -u

          raw="$CLOUDFLARE_API_TOKEN"
          token="$(printf '%s' "$raw" | grep -oE '(cfut_|cfat_)[A-Za-z0-9._~-]+' | head -n 1 || true)"
          if [ -z "$token" ]; then
            token="$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Authorization:[[:space:]]*Bearer[[:space:]]+//I; s/^Bearer[[:space:]]+//I; s/^CLOUDFLARE_API_TOKEN=//')"
            token="${token#\"}"; token="${token%\"}"; token="${token#\'}"; token="${token%\'}"
          fi
          echo "::add-mask::$token"

          zone="$(curl -sS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones?name=loprax.dpdns.org")"
          zone_id="$(echo "$zone" | jq -r '.result[0].id')"

          echo "=== CLOUDFLARE DNSSEC API ==="
          curl -sS -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/zones/$zone_id/dnssec" | jq -c '{success,errors,result}'

          echo "=== PARENT AUTH DS ==="
          for ns in ns1.digitalplat.org ns2.digitalplat.org ns3.digitalplat.org ns4.digitalplat.org; do
            echo "--- @$ns ---"
            dig +time=3 +tries=1 +norecurse @"$ns" DS loprax.dpdns.org +dnssec +noall +answer +authority +comments || true
          done

          echo "=== PUBLIC DS ==="
          for r in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222 223.5.5.5 119.29.29.29; do
            echo "--- @$r DS ---"
            dig +time=3 +tries=1 @"$r" DS loprax.dpdns.org +dnssec +noall +answer +authority +comments || true
          done

          echo "=== CLOUDFLARE AUTH DNSKEY ==="
          for ns in lovisa.ns.cloudflare.com rodrigo.ns.cloudflare.com; do
            echo "--- @$ns DNSKEY ---"
            dig +time=3 +tries=1 +norecurse @"$ns" DNSKEY loprax.dpdns.org +dnssec +noall +answer +authority +comments || true
            echo "--- @$ns A ---"
            dig +time=3 +tries=1 +norecurse @"$ns" A loprax.dpdns.org +dnssec +noall +answer +authority +comments || true
          done
