name: Import Flow portal logo

on:
  push:
    paths:
      - ".github/workflows/import-flow-logo.yml"

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Flow logo from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/flow
          curl -fL --retry 2 'https://uc8caf71334b526b3255d23e8512.dl.dropboxusercontent.com/cd/0/get/DJbno2on75_R_PcpZS2qmiIDdXNQ99U_pL82bUMyi3neOfVblUqqPHxgL_hk61bnQVoezidRtl2mtoiL1hucYUNSBO37OdoDcPSOuMklEIoYct33aiYt9EoUUuM4q7csX8KMUtZ8bEvo78pt9hQquv8TMaa8B9feMWChpdrw6MKdiQ/file?c_luid=e2a8d15f' -o public/assets/flow/flow-logo.jpg
          test "$(stat -c%s public/assets/flow/flow-logo.jpg)" -gt 100000
          file public/assets/flow/flow-logo.jpg | grep -qi 'JPEG image data'

      - name: Commit exact logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/flow/flow-logo.jpg
          if git diff --cached --quiet; then
            echo "No logo change."
            exit 0
          fi
          git commit -m "Fix Flow portal logo asset"
          git push origin HEAD:main
