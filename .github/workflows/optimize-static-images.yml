name: Optimize static images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-static-images.yml"
      - "public/assets/flow/flow-logo.png"
      - "public/assets/flow/flow-toolbox-bg.webp"
      - "public/assets/flow/flow-latest-admissions-bg.webp"
      - "public/assets/flow/flow-capacity-bg.webp"
      - "public/assets/protocol-25/exclamation.png"
      - "public/assets/protocol-25/skull.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-static-images
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Generate right-sized WebP assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs = [
              ("public/assets/flow/flow-logo.png", "public/assets/flow/flow-logo-opt.webp", (320, 133), 80),
              ("public/assets/flow/flow-toolbox-bg.webp", "public/assets/flow/flow-toolbox-bg-opt.webp", (960, 320), 68),
              ("public/assets/flow/flow-latest-admissions-bg.webp", "public/assets/flow/flow-latest-admissions-bg-opt.webp", (960, 320), 68),
              ("public/assets/flow/flow-capacity-bg.webp", "public/assets/flow/flow-capacity-bg-opt.webp", (960, 320), 68),
              ("public/assets/protocol-25/exclamation.png", "public/assets/protocol-25/exclamation-opt.webp", (512, 512), 78),
              ("public/assets/protocol-25/skull.png", "public/assets/protocol-25/skull-opt.webp", (640, 640), 78),
          ]

          for src, dst, size, quality in jobs:
              src_path = Path(src)
              dst_path = Path(dst)
              with Image.open(src_path) as image:
                  image.thumbnail(size, Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                  dst_path.parent.mkdir(parents=True, exist_ok=True)
                  image.save(dst_path, "WEBP", quality=quality, method=6)
                  print(f"{src_path} -> {dst_path}: {image.width}x{image.height}, {dst_path.stat().st_size} bytes")
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/assets)" ]; then
            echo "Optimized assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          git commit -m "perf: add optimized webp assets"
          git pull --rebase origin main
          git push
