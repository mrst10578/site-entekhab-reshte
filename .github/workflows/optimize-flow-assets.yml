name: Optimize Flow assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-flow-assets.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert Flow PNG assets to optimized WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          folder = Path("public/assets/flow")
          files = [
              ("flow-toolbox-bg.png", "flow-toolbox-bg.webp", 1400, 82),
              ("flow-latest-admissions-bg.png", "flow-latest-admissions-bg.webp", 1400, 82),
              ("flow-capacity-bg.png", "flow-capacity-bg.webp", 1400, 82),
              ("flow-divider-1.png", "flow-divider-1.webp", 900, 76),
              ("flow-divider-2.png", "flow-divider-2.webp", 900, 76),
          ]

          for src_name, dst_name, max_width, quality in files:
              src = folder / src_name
              dst = folder / dst_name
              with Image.open(src) as im:
                  im = im.convert("RGB")
                  if im.width > max_width:
                      h = round(im.height * max_width / im.width)
                      im = im.resize((max_width, h), Image.Resampling.LANCZOS)
                  im.save(dst, "WEBP", quality=quality, method=6)
                  print(src_name, "->", dst_name, dst.stat().st_size)
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/flow/*.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add optimized Flow WebP assets"
          git push origin HEAD:main
