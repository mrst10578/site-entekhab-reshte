name: Import Entekhab Yar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-entekhab-yar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-entekhab-yar
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO: wazyxoi/major-helper
      SOURCE_COMMIT: 5ae840b255d303200895acee2cf8b5577ab0c918
      TARGET_DIR: public/entekhab-yar

    steps:
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch pinned source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/major-helper
          git clone --filter=blob:none --no-checkout "https://github.com/$SOURCE_REPO.git" /tmp/major-helper
          git -C /tmp/major-helper checkout "$SOURCE_COMMIT"

      - name: Import as Entekhab Yar 1405
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          cp /tmp/major-helper/data.json "$TARGET_DIR/data.json"
          cp /tmp/major-helper/IRANSansX.woff2 "$TARGET_DIR/IRANSansX.woff2"

          node <<'NODE'
          const fs = require("fs");
          const src = "/tmp/major-helper/index.html";
          const dest = "public/entekhab-yar/index.html";
          let html = fs.readFileSync(src, "utf8");

          html = html
            .replace(
              "<title>دستیار انتخاب رشته تجربی ۱۴۰۵ </title>",
              "<title>انتخاب‌یار ۱۴۰۵ | دیتابیس انتخاب رشته</title>",
            )
            .replace(
              '<h1><a href="https://wazyxoi.github.io/major-helper/" style="text-decoration: none;">دستیار انتخاب رشته ۱۴۰۵</a></h1>',
              '<h1><a href="/entekhab-yar/" style="text-decoration:none;color:inherit">انتخاب‌یار ۱۴۰۵</a></h1>',
            )
            .replace(
              '<button class="fav-button" id="showFavorites">★ علاقه‌مندی‌ها <span class="fav-count" id="favCount">۰</span></button>',
              '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a class="fav-button" href="/" style="text-decoration:none;color:inherit">← بازگشت به دیتابیس</a><button class="fav-button" id="showFavorites">★ علاقه‌مندی‌ها <span class="fav-count" id="favCount">۰</span></button></div>',
            );

          html = html.replace(
            "<body>",
            '<body data-source="wazyxoi/major-helper@5ae840b255d303200895acee2cf8b5577ab0c918">',
          );

          fs.writeFileSync(dest, html);
          NODE

          cat > "$TARGET_DIR/SOURCE.txt" <<'EOF'
          Entekhab Yar 1405
          Imported from: https://github.com/wazyxoi/major-helper
          Source commit: 5ae840b255d303200895acee2cf8b5577ab0c918
          Imported path: /entekhab-yar/
          EOF

          test -s "$TARGET_DIR/index.html"
          test -s "$TARGET_DIR/data.json"
          test -s "$TARGET_DIR/IRANSansX.woff2"

          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/entekhab-yar/data.json","utf8")); if(!d || Array.isArray(d) || !Object.keys(d).length) process.exit(1); console.log("majors",Object.keys(d).length);'

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/entekhab-yar
          if git diff --cached --quiet; then
            echo "Imported snapshot already matches pinned source."
            exit 0
          fi
          git commit -m "feat: import Entekhab Yar 1405 snapshot"
          git push
