name: Patch 1404 rank 1 Mashhad medicine

on:
  push:
    paths:
      - ".github/workflows/patch-1404-r1-mashhad.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add exact admission record
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "public/data/1404.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          if (!Array.isArray(data)) throw new Error("1404 snapshot is not an array");

          const target = {
            id: "1404-exp-r1-1-mashhad-medicine",
            year: 1404,
            quota: "region-1",
            rank: 1,
            major: "پزشکی",
            university: "دانشگاه علوم پزشکی مشهد",
            group: "تجربی",
            source: "data/raw/kanoon/experimental/1404/region-1.jsonl"
          };

          const same = (r) =>
            r &&
            r.year === target.year &&
            r.quota === target.quota &&
            Number(r.rank) === target.rank &&
            String(r.major || "").trim() === target.major &&
            String(r.university || "").trim() === target.university &&
            String(r.group || "").trim() === target.group;

          const before = data.filter(same).length;
          if (!before) data.push(target);

          data.sort((a, b) =>
            Number(a.rank || 0) - Number(b.rank || 0) ||
            String(a.major || "").localeCompare(String(b.major || ""), "fa")
          );

          fs.writeFileSync(path, JSON.stringify(data));
          const after = data.filter(same).length;
          if (after !== 1) throw new Error(`Expected exactly one target record, found ${after}`);
          console.log(`target_before=${before} target_after=${after} records=${data.length}`);
          NODE

          git diff --check
          grep -q '"rank":1,"major":"پزشکی","university":"دانشگاه علوم پزشکی مشهد"' public/data/1404.json

      - name: Commit snapshot patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/1404.json
          if git diff --cached --quiet; then
            echo "Snapshot already contains target record."
            exit 0
          fi
          git commit -m "Add 1404 region 1 rank 1 Mashhad medicine snapshot record"
          git pull --rebase origin main
          git push origin HEAD:main
