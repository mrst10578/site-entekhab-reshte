name: Temporary Cloudflare Snapshot
# one-off snapshot trigger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: npm run build

      - name: Deploy temporary Cloudflare snapshot
        run: npx --yes wrangler@4 deploy --temporary
