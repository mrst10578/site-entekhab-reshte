name: Live site probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workers URLs
        shell: bash
        run: |
          set +e
          for url in "https://konkour-database.loprax.workers.dev/" "https://konkour-database-backup.loprax.workers.dev/" "https://konkour-database.loprax.workers.dev/sw.js" "https://konkour-database.loprax.workers.dev/assets/flow/flow-toolbox-bg.webp"; do
            echo "===== $url ====="
            host=$(echo "$url" | sed -E 's#https?://([^/]+)/?.*#\1#')
            echo "-- DNS --"
            getent hosts "$host" || true
            echo "-- HEAD --"
            curl -sS -I -L --max-time 20 "$url" || true
            echo "-- GET --"
            curl -sS -L --max-time 20 -o /tmp/body -w "status=%{http_code} final=%{url_effective} size=%{size_download} time=%{time_total}\n" "$url" || true
            head -c 500 /tmp/body 2>/dev/null || true
            echo
            if [[ "$url" == "https://konkour-database.loprax.workers.dev/" || "$url" == "https://konkour-database-backup.loprax.workers.dev/" ]]; then
              echo "-- RECOVERY CHECK --"
              if grep -q 'konkour_boot_recovery_v3' /tmp/body; then
                echo "boot-recovery=present"
              else
                echo "boot-recovery=absent"
              fi
            fi
            echo
          done
