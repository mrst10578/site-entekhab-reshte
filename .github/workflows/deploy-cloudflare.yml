name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_ACCOUNT_ID: "e032e8143b7eada8b54ef839e0b779a4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: npm run build

      - name: Normalize and verify Cloudflare token
        shell: bash
        run: |
          raw="$CLOUDFLARE_API_TOKEN"
          if [ -z "$raw" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

          # Accept either the raw token, a Bearer header, or Cloudflare's copied curl example.
          if [[ "$raw" =~ [Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+([A-Za-z0-9._~-]+) ]]; then
            token="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ CLOUDFLARE_API_TOKEN[[:space:]]*=[[:space:]]*[\"\']?([A-Za-z0-9._~-]+) ]]; then
            token="${BASH_REMATCH[1]}"
          else
            token="${raw//$'\r'/}"
            token="${token//$'\n'/}"
            token="$(printf '%s' "$token" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            token="${token#\"}"
            token="${token%\"}"
            token="${token#\'}"
            token="${token%\'}"
          fi

          if [ -z "$token" ]; then
            echo "::error::Could not extract a Cloudflare API token from CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

          response="$(curl -sS -w $'\n%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the API token during verification (HTTP $status)."
            echo "$body"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
